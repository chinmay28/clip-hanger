# Build and publish a GitHub release for the commit this runs on.
#
# The tag is computed, not typed: scripts/version.mjs renders
# vYEAR.MONTH.PATCH with YEAR.MONTH = HEAD's committer month and PATCH = the
# commit count, so the full history matters (fetch-depth: 0 — a shallow
# checkout reports patch 0 and the run refuses to release it). The release
# body is the CHANGELOG.md section whose heading names the tag exactly.
#
# Three things start it: a tag, a push to main, and a manual dispatch. A push
# to main publishes only when the commit names its own version in
# CHANGELOG.md (see "Release notes" below); any other push to main is
# skipped. A tag or a dispatch without that section fails.
#
# The deliverables are what scripts/build-release.sh produces — the
# clip-<version>-<os>-<arch> binaries, which scripts/quickstart.sh
# (CLIP_INSTALL=release) downloads by exactly those names, and SHA256SUMS,
# which it verifies them against — plus the Android app under a name that
# never changes, clip-hanger.apk, so
# .../releases/latest/download/clip-hanger.apk always works.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the patch number is the commit count; shallow = 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # For the phone app. The runner image ships the Android SDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute version
        id: version
        run: |
          VERSION="$(node scripts/version.mjs)"
          PATCH="$(node scripts/version.mjs --patch)"
          if [ "${PATCH}" = "0" ]; then
            echo "patch is 0 — unstamped build, refusing to release" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${VERSION}" ]; then
            echo "tag ${GITHUB_REF_NAME} names a commit that builds ${VERSION} — refusing to publish it" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"

      # The changelog heading is the release gate: a branch push whose version
      # has no section is an ordinary commit, not a release, and is skipped —
      # so only a commit that names its own version in CHANGELOG.md publishes.
      # A tag or manual dispatch without the section is an error outright.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          awk -v tag="${{ steps.version.outputs.version }}" '
            $0 == "## " tag { found = 1; next }
            /^## / && found { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "no '## ${{ steps.version.outputs.version }}' section in CHANGELOG.md — not a release commit, skipping"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section — a tag the changelog does not name must not be published" >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      # The web client, then every platform's binary with it embedded, and
      # SHA256SUMS — the same script `make release` runs.
      - name: Build clip binaries
        if: steps.notes.outputs.release == 'true'
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}"

      # The release key, so every release installs over the last one. Without
      # the secrets the APK falls back to this runner's debug key, which no
      # earlier release was signed with, so it warns instead of failing.
      - name: Release signing key
        if: steps.notes.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::no ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets: the APK is signed with this runner's debug key and will not install over an earlier release"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      # The phone app, stamped with this release's version: the version as
      # its name, the commit count — which only grows — as its code.
      - name: Build clip-hanger.apk
        if: steps.notes.outputs.release == 'true'
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.patch }}"
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ] || [ ! -f "${apks[0]}" ]; then
            echo "expected exactly one release APK, found: ${apks[*]}" >&2
            exit 1
          fi
          cp "${apks[0]}" ../../dist/clip-hanger.apk

      # build-release.sh summed the binaries; the APK joins them, so one
      # SHA256SUMS covers every asset.
      - name: Checksums
        if: steps.notes.outputs.release == 'true'
        run: (cd dist && sha256sum clip-* > SHA256SUMS && cat SHA256SUMS)

      - name: Publish release
        if: steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "release ${VERSION} already exists — nothing to publish"
            exit 0
          fi
          gh release create "${VERSION}" \
            dist/clip-"${VERSION}"-* \
            dist/clip-hanger.apk \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file notes.md
