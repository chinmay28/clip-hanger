name: Clip Hanger (Android app)

# Builds the phone app and runs its tests whenever it changes, or anything
# its contract with the server's page and the server lives in: the web
# client's native-player hook (web/src/nativeApp.js), the icon it is drawn
# from, and the LAN discovery responder it finds servers with.

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "web/src/**"
      - "web/public/icon.svg"
      - "internal/discover/**"
      - "scripts/make-icons.mjs"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "web/src/**"
      - "web/public/icon.svg"
      - "internal/discover/**"
      - "scripts/make-icons.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test the APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version's patch number is the commit count

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The server half of "Find on this network".
      - name: Discovery responder tests
        working-directory: .
        run: go test -count=1 ./internal/discover/

      # The page half of the native player: in a browser nothing changes,
      # inside the app Play hands the hour over.
      - name: Web client tests
        working-directory: web
        run: npm ci && npm test

      # The launcher icons are drawn from web/public/icon.svg; a hand edit,
      # or an SVG change nobody re-rendered, fails here.
      - name: Icons match icon.svg
        working-directory: .
        run: node scripts/make-icons.mjs --check

      # Everything the app decides, as plain JVM tests.
      - name: Unit tests
        run: ./gradlew --no-daemon :core:test

      # The runner image ships the Android SDK; ANDROID_HOME points at it.
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -PappVersionName="$(node ../../scripts/version.mjs)" \
            -PappVersionCode="$(node ../../scripts/version.mjs --patch)"

      # What the APK must carry: the page bridge (without it Play falls back
      # to the web view's <video>) and Media3 (without it there is no player).
      - name: Check the APK contents
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          listing=$(unzip -l "$apk")
          echo "$listing" | grep -q "assets/cliphanger-bridge.js" || { echo "no cliphanger-bridge.js in $apk" >&2; exit 1; }
          unzip -p "$apk" 'classes*.dex' | grep -aq "androidx/media3/exoplayer/ExoPlayer" || { echo "no Media3 ExoPlayer in $apk" >&2; exit 1; }
          echo "bridge and Media3 present"

      - uses: actions/upload-artifact@v4
        with:
          name: clip-hanger-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
